[package]
name = "helmsman"
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
authors = ["Abdelkader Boudih <oss@seuros.com>"]
license = "BSD-3-Clause"
description = "Adaptive instruction server"
homepage = "https://github.com/seuros/helmsman"
repository = "https://github.com/seuros/helmsman"
documentation = "https://docs.rs/helmsman"

[dependencies]
# Core (always-on): engine/models/config/skills/environment depend only on these.
minijinja = { version = "2", features = ["loader"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "7"
glob = "0.3"
thiserror = "2"
serde_yaml = "0.9"

# CLI/MCP-binary-only, gated behind the `cli` feature.
mcp-host = { version = "0.14.0", features = ["macros"], optional = true }
serde_json = { version = "1", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
usage-rs = { version = "7.0.0", optional = true }
tiktoken-rs = { version = "0.12", optional = true }
similar = { version = "3.2", optional = true }
rand = { version = "0.10", optional = true }
tempfile = { version = "3", optional = true }
dialoguer = { version = "0.12", optional = true }
jiff = { version = "0.2.37", features = ["serde"], optional = true }

[features]
default = ["cli"]
cli = [
    "mcp-host",
    "serde_json",
    "uuid",
    "tokio",
    "usage-rs",
    "tiktoken-rs",
    "similar",
    "rand",
    "tempfile",
    "dialoguer",
    "jiff",
]

[[bin]]
name = "helmsman"
path = "src/main.rs"
required-features = ["cli"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
